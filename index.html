<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>实时翻译</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --fg-2: #555555;
    --fg-3: #888888;
    --border: #d4d4d4;
    --panel: #f5f5f5;
    --accent: #0066cc;
    --record: #d63031;
    --pause: #e67e22;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Heiti SC", sans-serif;
    background: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    padding: 16px;
    font-size: 18px;
    line-height: 1.4;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .title { font-size: 24px; font-weight: 700; }
  .icon-btn {
    background: transparent;
    border: 2px solid var(--border);
    width: 44px; height: 44px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 22px;
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:active { background: var(--panel); }

  .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 14px;
    color: var(--fg-2);
    margin-bottom: 12px;
    min-height: 22px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--fg-3);
    transition: background 0.3s;
  }
  .dot.connecting { background: var(--pause); animation: pulse 1s infinite; }
  .dot.connected { background: #27ae60; }
  .dot.error { background: var(--record); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .direction-swap {
    display: flex;
    align-items: stretch;
    justify-content: center;
    gap: 0;
    border: 2px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 14px;
    height: 64px;
  }
  .swap-side {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    background: var(--bg);
    color: var(--fg);
    border: none;
    cursor: pointer;
    padding: 0;
  }
  .swap-side:active { background: var(--panel); }
  .swap-side.from { background: var(--accent); color: white; }
  .swap-arrow {
    width: 72px;
    background: var(--fg);
    color: var(--bg);
    border: none;
    font-size: 28px;
    cursor: pointer;
    font-weight: 700;
    padding: 0;
  }
  .swap-arrow:active { opacity: 0.7; }
  .swap-arrow.dual { background: #7e57c2; }

  .cards {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 4px 2px;
    min-height: 200px;
  }
  .card {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    word-wrap: break-word;
    animation: cardIn 0.25s ease-out;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .card.active { border-color: var(--accent); border-width: 3px; }
  .card-flag {
    font-size: 13px;
    font-weight: 600;
    color: var(--fg-2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-primary {
    font-size: 28px;
    line-height: 1.35;
    font-weight: 600;
    color: var(--fg);
    min-height: 1em;
  }
  .card-secondary {
    font-size: 15px;
    line-height: 1.4;
    color: var(--fg-2);
    font-weight: 400;
    padding-top: 4px;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg-3);
    font-size: 18px;
    text-align: center;
    padding: 20px;
  }
  .mute-toggle {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 4px;
  }
  .mute-btn {
    background: var(--bg);
    border: 2px solid var(--border);
    color: var(--fg);
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 600;
  }
  .mute-btn.muted { color: var(--record); border-color: var(--record); }

  .controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding-top: 18px;
  }
  .big-btn {
    flex: 1;
    height: 84px;
    border-radius: 18px;
    border: none;
    color: white;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
    transition: transform 0.1s;
  }
  .big-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .big-btn:disabled { background: var(--fg-3) !important; cursor: not-allowed; box-shadow: none; opacity: 0.5; }
  .btn-start { background: #27ae60; }
  .btn-start.recording { background: var(--record); animation: rec 1.5s infinite; }
  .btn-stop { background: var(--record); }
  @keyframes rec {
    0%, 100% { box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 0 0 0 rgba(214,48,49,0.5); }
    50% { box-shadow: 0 6px 0 rgba(0,0,0,0.15), 0 0 0 14px rgba(214,48,49,0); }
  }

  .error {
    background: #ffe5e5;
    border: 2px solid var(--record);
    color: var(--record);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 15px;
    margin-bottom: 12px;
    display: none;
    font-weight: 500;
  }
  .error.show { display: block; }

  /* Settings overlay */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .overlay.show { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-width: 500px;
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .sheet-title {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 15px; font-weight: 600; color: var(--fg-2); }
  .field input {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    font-size: 18px;
    color: var(--fg);
    outline: none;
    width: 100%;
  }
  .field input:focus { border-color: var(--accent); }
  .seg {
    display: flex;
    border: 2px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .seg-btn {
    flex: 1;
    background: var(--bg);
    border: none;
    padding: 12px;
    font-size: 16px;
    color: var(--fg);
    cursor: pointer;
    font-weight: 500;
  }
  .seg-btn.active { background: var(--fg); color: var(--bg); font-weight: 700; }
  .seg-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .seg-btn:not(:last-child) { border-right: 2px solid var(--border); }
  .close-btn {
    background: var(--fg);
    color: var(--bg);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .field-hint { font-size: 13px; color: var(--fg-3); }

  .cost {
    font-size: 13px;
    color: var(--fg-3);
    text-align: center;
    margin-top: 8px;
  }
  .cost strong { color: var(--fg); }

  @media (max-width: 380px) {
    body { padding: 12px; font-size: 16px; }
    .title { font-size: 20px; }
    .swap-side { font-size: 18px; }
    .panel-text { font-size: 22px; }
    .mic-btn { width: 84px; height: 84px; font-size: 34px; }
    .ctrl-btn { width: 60px; height: 60px; font-size: 24px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="title">实时翻译</div>
  <button class="icon-btn" id="openSettings" title="设置">⚙</button>
</div>

<div class="status-bar">
  <span class="dot" id="statusDot"></span>
  <span id="statusText">未连接</span>
</div>

<div class="error" id="errorBox"></div>

<div class="direction-swap" id="dirSwap">
  <button class="swap-side" id="leftLabel">🇨🇳 中文</button>
  <button class="swap-arrow" id="swapBtn" title="点击切换单向/双向">→</button>
  <button class="swap-side" id="rightLabel">🇺🇸 English</button>
</div>

<div class="cards" id="cards">
  <div class="empty-state" id="emptyState">点击开始对话, 翻译卡片会出现在这里</div>
</div>
<div class="mute-toggle">
  <button class="mute-btn" id="muteAll">🔊 语音</button>
</div>

<div class="controls">
  <button class="big-btn btn-start" id="startBtn" disabled>🎤 开始对话</button>
  <button class="big-btn btn-stop" id="stopBtn" disabled>⏹ 结束对话</button>
</div>

<div class="cost">
  <span id="costLine">点击 ⚙ 填入 API Key 开始</span>
</div>

<!-- Settings sheet -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <div class="sheet-title">设置</div>
    <div class="field">
      <label>OpenAI API Key</label>
      <input type="password" id="apiKey" placeholder="sk-..." autocomplete="off">
      <div class="field-hint">仅保存在本地浏览器, 不上传第三方。境内使用需翻墙 (api.openai.com 被墙)。</div>
    </div>
    <button class="close-btn" id="closeSettings">完成</button>
  </div>
</div>

<audio id="audio_en" autoplay playsinline></audio>
<audio id="audio_zh" autoplay playsinline></audio>

<script>
const MODEL = "gpt-realtime-translate";
const CLIENT_SECRETS_URL = "https://api.openai.com/v1/realtime/translations/client_secrets";
const CALLS_URL = "https://api.openai.com/v1/realtime/translations/calls";

const els = {
  apiKey: document.getElementById('apiKey'),
  startBtn: document.getElementById('startBtn'),
  stopBtn: document.getElementById('stopBtn'),
  statusDot: document.getElementById('statusDot'),
  statusText: document.getElementById('statusText'),
  errorBox: document.getElementById('errorBox'),
  costLine: document.getElementById('costLine'),
  cards: document.getElementById('cards'),
  emptyState: document.getElementById('emptyState'),
  muteAll: document.getElementById('muteAll'),
  audio_en: document.getElementById('audio_en'),
  audio_zh: document.getElementById('audio_zh'),
  leftLabel: document.getElementById('leftLabel'),
  rightLabel: document.getElementById('rightLabel'),
  swapBtn: document.getElementById('swapBtn'),
  dirSwap: document.getElementById('dirSwap'),
  openSettings: document.getElementById('openSettings'),
  closeSettings: document.getElementById('closeSettings'),
  overlay: document.getElementById('overlay'),
};

const STATE = {
  targetLang: localStorage.getItem('target_lang') || 'en',
  sessions: [],
  localStream: null,
  isRecording: false,
  audioMuted: localStorage.getItem('audio_muted') === '1',
  recordStartMs: 0,
  costTimer: null,
  activeCard: null,
  nextStartsNew: true,
};

const MAX_CARDS = 5;

// Init
els.apiKey.value = localStorage.getItem('openai_api_key') || '';
applyDirection(STATE.targetLang);
updateMicBtn();
renderCostIdle();

els.openSettings.addEventListener('click', () => els.overlay.classList.add('show'));
els.closeSettings.addEventListener('click', () => els.overlay.classList.remove('show'));
els.overlay.addEventListener('click', (e) => {
  if (e.target === els.overlay) els.overlay.classList.remove('show');
});

els.apiKey.addEventListener('input', () => {
  localStorage.setItem('openai_api_key', els.apiKey.value.trim());
  updateMicBtn();
});

// Click left label → speaker is 中文 → target=en
els.leftLabel.addEventListener('click', () => setDirection('en'));
// Click right label → speaker is English → target=zh
els.rightLabel.addEventListener('click', () => setDirection('zh'));
// Click arrow → flip direction
els.swapBtn.addEventListener('click', () => {
  setDirection(STATE.targetLang === 'en' ? 'zh' : 'en');
});

function setDirection(target) {
  if (STATE.targetLang === target) return;
  STATE.targetLang = target;
  localStorage.setItem('target_lang', STATE.targetLang);
  applyDirection(STATE.targetLang);

  // Live switch if recording
  if (STATE.isRecording && STATE.sessions[0]) {
    const sess = STATE.sessions[0];
    sess.target = STATE.targetLang;
    try {
      const newAudio = STATE.targetLang === 'en' ? els.audio_en : els.audio_zh;
      const oldAudio = STATE.targetLang === 'en' ? els.audio_zh : els.audio_en;
      if (sess.audioEl && sess.audioEl.srcObject && newAudio !== sess.audioEl) {
        newAudio.srcObject = sess.audioEl.srcObject;
        oldAudio.srcObject = null;
      }
      sess.audioEl = newAudio;
    } catch {}

    try {
      sess.dc.send(JSON.stringify({
        type: 'session.update',
        session: {
          audio: {
            input: { transcription: { model: 'gpt-4o-mini-transcribe' } },
            output: { language: STATE.targetLang },
          },
        },
      }));
    } catch (err) {
      showError('切换失败, 请重新开始: ' + err.message);
    }
  }
}

els.muteAll.addEventListener('click', () => {
  STATE.audioMuted = !STATE.audioMuted;
  localStorage.setItem('audio_muted', STATE.audioMuted ? '1' : '0');
  applyMute();
});
function applyMute() {
  els.audio_en.muted = STATE.audioMuted;
  els.audio_zh.muted = STATE.audioMuted;
  els.muteAll.textContent = STATE.audioMuted ? '🔇 静音' : '🔊 语音';
  els.muteAll.classList.toggle('muted', STATE.audioMuted);
}
applyMute();

function applyDirection(target) {
  els.leftLabel.textContent = '🇨🇳 中文';
  els.rightLabel.textContent = '🇺🇸 English';
  els.swapBtn.title = '点击切换方向';
  if (target === 'en') {
    els.leftLabel.classList.add('from');
    els.rightLabel.classList.remove('from');
    els.swapBtn.textContent = '→';
  } else {
    els.leftLabel.classList.remove('from');
    els.rightLabel.classList.add('from');
    els.swapBtn.textContent = '←';
  }
}

function updateMicBtn() {
  const hasKey = !!els.apiKey.value.trim();
  els.startBtn.disabled = !hasKey || STATE.isRecording;
}

function updateControls() {
  const hasKey = !!els.apiKey.value.trim();
  els.startBtn.disabled = !hasKey || STATE.isRecording;
  els.stopBtn.disabled = !STATE.isRecording;
  els.startBtn.classList.toggle('recording', STATE.isRecording);
  els.startBtn.textContent = STATE.isRecording ? '🔴 正在听...' : '🎤 开始对话';
  els.swapBtn.disabled = false;
}

function setStatus(state, text) {
  els.statusDot.className = 'dot ' + state;
  els.statusText.textContent = text;
}

function showError(msg) {
  els.errorBox.textContent = msg;
  els.errorBox.classList.add('show');
  setTimeout(() => els.errorBox.classList.remove('show'), 8000);
}

function renderCostIdle() {
  els.costLine.innerHTML = '<strong>¥0.25/分钟</strong>';
}

function startCostTimer() {
  STATE.recordStartMs = Date.now();
  const ratePerMin = 0.25;
  const update = () => {
    const elapsedMin = (Date.now() - STATE.recordStartMs) / 60000;
    const cost = elapsedMin * ratePerMin;
    const min = Math.floor(elapsedMin);
    const sec = Math.floor((elapsedMin - min) * 60);
    els.costLine.innerHTML = `已用 ${min}:${String(sec).padStart(2,'0')} · 花费 <strong>¥${cost.toFixed(2)}</strong>`;
  };
  update();
  STATE.costTimer = setInterval(update, 1000);
}

function stopCostTimer() {
  if (STATE.costTimer) { clearInterval(STATE.costTimer); STATE.costTimer = null; }
  renderCostIdle();
}

els.startBtn.addEventListener('click', start);
els.stopBtn.addEventListener('click', stop);

async function start() {
  const key = els.apiKey.value.trim();
  if (!key) {
    els.overlay.classList.add('show');
    return showError('请先填入 API Key');
  }
  localStorage.setItem('openai_api_key', key);

  try {
    setStatus('connecting', '连接中...');

    STATE.localStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });

    STATE.sessions = [await createSession(key, STATE.targetLang)];

    STATE.isRecording = true;
    setStatus('connected', '正在听');
    clearCards();
    updateControls();
    startCostTimer();
  } catch (err) {
    console.error(err);
    showError(err.message);
    setStatus('error', '错误');
    await stop();
  }
}

async function createSession(key, target) {
  const sessionConfig = {
    session: {
      model: MODEL,
      audio: {
        input: {
          transcription: { model: 'gpt-4o-mini-transcribe' },
        },
        output: {
          language: target,
        },
      },
    },
  };

  const csResp = await fetch(CLIENT_SECRETS_URL, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${key}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(sessionConfig),
  });

  if (!csResp.ok) {
    const errText = await csResp.text();
    throw new Error(`获取凭证失败 (${csResp.status}): ${errText}`);
  }

  const csData = await csResp.json();
  const clientSecret = csData.value || csData.client_secret?.value || csData.client_secret;
  if (!clientSecret) throw new Error('返回数据中找不到 client_secret');

  const pc = new RTCPeerConnection();
  const audioEl = target === 'en' ? els.audio_en : els.audio_zh;

  pc.ontrack = (e) => { audioEl.srcObject = e.streams[0]; };

  STATE.localStream.getTracks().forEach(t => pc.addTrack(t, STATE.localStream));

  const dc = pc.createDataChannel('oai-events');
  const sess = { pc, dc, target, audioEl };
  dc.addEventListener('open', () => onDcOpen(sess));
  dc.addEventListener('message', (e) => onDcMessage(sess, e));
  dc.addEventListener('close', () => setStatus('', '已断开'));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const sdpResp = await fetch(CALLS_URL, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${clientSecret}`,
      'Content-Type': 'application/sdp',
    },
    body: offer.sdp,
  });

  if (!sdpResp.ok) {
    const errText = await sdpResp.text();
    throw new Error(`SDP 交换失败 (${sdpResp.status}): ${errText}`);
  }

  const answerSdp = await sdpResp.text();
  await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  return sess;
}

function onDcOpen(sess) {
  const sessionUpdate = {
    type: 'session.update',
    session: {
      audio: {
        input: { transcription: { model: 'gpt-4o-mini-transcribe' } },
        output: { language: sess.target },
      },
    },
  };
  try { sess.dc.send(JSON.stringify(sessionUpdate)); } catch {}
}

const accum = new WeakMap();
function getAcc(sess) {
  let a = accum.get(sess);
  if (!a) { a = { source: '', target: '' }; accum.set(sess, a); }
  return a;
}

const FLAG = { zh: '🇨🇳', en: '🇺🇸' };
const LANG_NAME = { zh: '中文', en: 'English' };

function newCard(sess) {
  if (els.emptyState) { els.emptyState.remove(); els.emptyState = null; }

  const targetLang = sess.target;
  const sourceLang = targetLang === 'en' ? 'zh' : 'en';

  const el = document.createElement('div');
  el.className = 'card active';
  el.innerHTML = `
    <div class="card-flag">${FLAG[sourceLang]} ${LANG_NAME[sourceLang]} → ${FLAG[targetLang]} ${LANG_NAME[targetLang]}</div>
    <div class="card-primary" data-role="primary"></div>
    <div class="card-secondary" data-role="secondary"></div>
  `;
  els.cards.prepend(el);

  // Trim to MAX_CARDS
  while (els.cards.children.length > MAX_CARDS) {
    els.cards.removeChild(els.cards.lastElementChild);
  }

  return {
    el,
    primary: el.querySelector('[data-role="primary"]'),
    secondary: el.querySelector('[data-role="secondary"]'),
    source: '',
    target: '',
    sourceLang,
    targetLang,
  };
}

function renderCard(card) {
  card.primary.textContent = card.target || '…';
  card.secondary.textContent = card.source || '';
}

function clearCards() {
  els.cards.innerHTML = '<div class="empty-state" id="emptyState">点击开始对话, 翻译卡片会出现在这里</div>';
  els.emptyState = document.getElementById('emptyState');
  STATE.activeCard = null;
  STATE.nextStartsNew = true;
}

function onDcMessage(sess, e) {
  let evt;
  try { evt = JSON.parse(e.data); } catch { return; }
  const a = getAcc(sess);

  switch (evt.type) {
    case 'session.input_transcript.delta':
    case 'conversation.item.input_audio_transcription.delta':
      a.source += (evt.delta || '');
      ensureCard(sess);
      STATE.activeCard.source = a.source;
      renderCard(STATE.activeCard);
      break;
    case 'session.input_transcript.completed':
    case 'conversation.item.input_audio_transcription.completed':
      if (evt.transcript) a.source = evt.transcript;
      ensureCard(sess);
      STATE.activeCard.source = a.source;
      renderCard(STATE.activeCard);
      a.source = '';
      break;
    case 'session.output_transcript.delta':
    case 'response.audio_transcript.delta':
      a.target += (evt.delta || '');
      ensureCard(sess);
      STATE.activeCard.target = a.target;
      renderCard(STATE.activeCard);
      break;
    case 'session.output_transcript.completed':
    case 'response.audio_transcript.done':
      if (evt.transcript) a.target = evt.transcript;
      ensureCard(sess);
      STATE.activeCard.target = a.target;
      renderCard(STATE.activeCard);
      STATE.activeCard.el.classList.remove('active');
      STATE.activeCard = null;
      STATE.nextStartsNew = true;
      a.target = '';
      break;
    case 'input_audio_buffer.speech_started':
    case 'input_audio_buffer.speech_stopped':
    case 'session.created':
    case 'session.updated':
      break;
    case 'error':
      showError(`API 错误: ${evt.error?.message || JSON.stringify(evt.error)}`);
      break;
  }
}

function ensureCard(sess) {
  if (STATE.nextStartsNew || !STATE.activeCard) {
    STATE.activeCard = newCard(sess);
    STATE.nextStartsNew = false;
  } else if (STATE.activeCard.targetLang !== sess.target) {
    // Direction changed mid-session: start fresh card
    STATE.activeCard.el.classList.remove('active');
    STATE.activeCard = newCard(sess);
  }
}

async function stop() {
  STATE.isRecording = false;

  for (const s of STATE.sessions) {
    try { s.dc.close(); } catch {}
    try { s.pc.close(); } catch {}
  }
  STATE.sessions = [];

  if (STATE.localStream) {
    STATE.localStream.getTracks().forEach(t => t.stop());
    STATE.localStream = null;
  }
  els.audio_en.srcObject = null;
  els.audio_zh.srcObject = null;
  setStatus('', '未连接');
  updateControls();
  stopCostTimer();
}

window.addEventListener('beforeunload', stop);
</script>
</body>
</html>
