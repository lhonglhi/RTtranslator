<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实时翻译 · RT Translator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 20px;
  }
  header { text-align: center; margin-bottom: 16px; }
  h1 {
    font-size: 26px;
    font-weight: 600;
    background: linear-gradient(90deg, #60a5fa, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: #94a3b8; font-size: 13px; margin-top: 4px; }

  .container {
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .row {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .row input, .row select {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 8px;
    padding: 10px 14px;
    color: #e2e8f0;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .row input:focus, .row select:focus { border-color: #60a5fa; }
  .row input[type="password"] { flex: 1; min-width: 200px; }
  .row label { font-size: 13px; color: #94a3b8; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #94a3b8;
    margin-left: auto;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #64748b;
    transition: background 0.3s;
  }
  .status-dot.connecting { background: #fbbf24; animation: pulse 1s infinite; }
  .status-dot.connected { background: #34d399; }
  .status-dot.error { background: #f87171; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  .toggle-group {
    background: rgba(30, 41, 59, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    padding: 6px;
    display: flex;
    gap: 4px;
  }
  .tg-btn {
    flex: 1;
    background: transparent;
    border: none;
    padding: 10px 14px;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tg-btn.active {
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }
  .tg-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .tg-btn .sub { display: block; font-size: 11px; opacity: 0.7; margin-top: 2px; }

  .mic-btn {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    color: white;
    font-size: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
    transition: transform 0.15s, box-shadow 0.2s;
  }
  .mic-btn:hover:not(:disabled) { transform: scale(1.05); box-shadow: 0 12px 30px rgba(59, 130, 246, 0.5); }
  .mic-btn:active:not(:disabled) { transform: scale(0.98); }
  .mic-btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; }
  .mic-btn.recording {
    background: linear-gradient(135deg, #ef4444, #f43f5e);
    animation: recordPulse 1.5s infinite;
  }
  .mic-btn.paused {
    background: linear-gradient(135deg, #f59e0b, #f97316);
    animation: none;
  }
  @keyframes recordPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
    50% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
  }
  .controls {
    display: flex;
    gap: 16px;
    justify-content: center;
    align-items: center;
  }
  .ctrl-btn {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: none;
    background: rgba(71, 85, 105, 0.6);
    color: #e2e8f0;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, transform 0.15s;
  }
  .ctrl-btn:hover:not(:disabled) {
    background: rgba(100, 116, 139, 0.8);
    transform: scale(1.05);
  }
  .ctrl-btn:active:not(:disabled) { transform: scale(0.95); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    flex: 1;
    min-height: 260px;
  }
  @media (max-width: 640px) {
    .panels { grid-template-columns: 1fr; }
  }
  .panel {
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-height: 180px;
  }
  .panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .panel-label {
    font-size: 12px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .mute-btn {
    background: transparent;
    border: 1px solid rgba(148, 163, 184, 0.3);
    color: #94a3b8;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    cursor: pointer;
  }
  .mute-btn.muted { color: #f87171; border-color: rgba(248, 113, 113, 0.5); }
  .panel-text {
    flex: 1;
    font-size: 17px;
    line-height: 1.6;
    color: #f1f5f9;
    overflow-y: auto;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .panel-text.muted-text { color: #64748b; font-style: italic; }
  .log {
    font-size: 12px;
    color: #64748b;
    text-align: center;
    min-height: 18px;
  }
  .error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
  }
  .error.show { display: block; }
  .hint {
    font-size: 12px;
    color: #64748b;
    text-align: center;
    margin-top: 4px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>实时翻译</h1>
  <div class="subtitle">gpt-realtime-translate · 中 ↔ 英</div>
</header>

<div class="container">
  <div class="row">
    <input type="password" id="apiKey" placeholder="OpenAI API Key (sk-...)" autocomplete="off">
    <select id="voice" title="译文语音" class="hidden">
      <option value="alloy">Alloy</option>
    </select>
    <div class="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </div>
  </div>

  <div class="toggle-group" id="modeBox">
    <button class="tg-btn active" data-mode="single">单向<span class="sub">¥0.25/分钟 · 手动切方向</span></button>
    <button class="tg-btn" data-mode="dual">双向<span class="sub">¥0.50/分钟 · 自动双向</span></button>
  </div>

  <div class="toggle-group" id="dirBox">
    <button class="tg-btn active" data-target="en">🇨🇳 中 → 英 🇺🇸</button>
    <button class="tg-btn" data-target="zh">🇺🇸 英 → 中 🇨🇳</button>
  </div>

  <div class="error" id="errorBox"></div>

  <div class="controls">
    <button class="ctrl-btn" id="pauseBtn" title="暂停 / 恢复" disabled>⏸</button>
    <button class="mic-btn" id="micBtn" disabled>🎤</button>
    <button class="ctrl-btn" id="stopBtn" title="停止" disabled>⏹</button>
  </div>
  <div class="log" id="log">填入 API Key 后选择模式, 点击麦克风开始</div>

  <div class="panels">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-label" id="panel1Label">🇨🇳 中文</div>
        <button class="mute-btn" id="mute1" data-target="zh">🔊 播放</button>
      </div>
      <div class="panel-text muted-text" id="panel1Text">等待...</div>
    </div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-label" id="panel2Label">🇺🇸 English</div>
        <button class="mute-btn" id="mute2" data-target="en">🔊 播放</button>
      </div>
      <div class="panel-text muted-text" id="panel2Text">Waiting...</div>
    </div>
  </div>
  <div class="hint">提示: API Key 仅存于本地浏览器。双向模式同时跑 2 个会话, 价格 ×2。</div>
</div>

<audio id="audio_en" autoplay playsinline></audio>
<audio id="audio_zh" autoplay playsinline></audio>

<script>
const MODEL = "gpt-realtime-translate";
const CLIENT_SECRETS_URL = "https://api.openai.com/v1/realtime/translations/client_secrets";
const CALLS_URL = "https://api.openai.com/v1/realtime/translations/calls";

const els = {
  apiKey: document.getElementById('apiKey'),
  voice: document.getElementById('voice'),
  micBtn: document.getElementById('micBtn'),
  pauseBtn: document.getElementById('pauseBtn'),
  stopBtn: document.getElementById('stopBtn'),
  statusDot: document.getElementById('statusDot'),
  statusText: document.getElementById('statusText'),
  log: document.getElementById('log'),
  errorBox: document.getElementById('errorBox'),
  modeBox: document.getElementById('modeBox'),
  dirBox: document.getElementById('dirBox'),
  panel1Label: document.getElementById('panel1Label'),
  panel2Label: document.getElementById('panel2Label'),
  panel1Text: document.getElementById('panel1Text'),
  panel2Text: document.getElementById('panel2Text'),
  mute1: document.getElementById('mute1'),
  mute2: document.getElementById('mute2'),
  audio_en: document.getElementById('audio_en'),
  audio_zh: document.getElementById('audio_zh'),
};

const STATE = {
  mode: localStorage.getItem('mode') || 'single', // 'single' | 'dual'
  targetLang: localStorage.getItem('target_lang') || 'en',
  sessions: [],
  localStream: null,
  isRecording: false,
  isPaused: false,
  muted: { en: false, zh: false },
};

// Restore UI
els.apiKey.value = localStorage.getItem('openai_api_key') || '';
els.voice.value = localStorage.getItem('voice') || 'verse';
applyMode(STATE.mode);
applyDirection(STATE.targetLang);
updateMicBtn();

els.apiKey.addEventListener('input', () => {
  localStorage.setItem('openai_api_key', els.apiKey.value.trim());
  updateMicBtn();
});
els.voice.addEventListener('change', () => {
  localStorage.setItem('voice', els.voice.value);
});

els.modeBox.querySelectorAll('.tg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (STATE.isRecording) return showError('录音中无法切模式, 请先停止');
    STATE.mode = btn.dataset.mode;
    localStorage.setItem('mode', STATE.mode);
    applyMode(STATE.mode);
  });
});

els.dirBox.querySelectorAll('.tg-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (STATE.isRecording) return showError('录音中无法切方向, 请先停止');
    STATE.targetLang = btn.dataset.target;
    localStorage.setItem('target_lang', STATE.targetLang);
    applyDirection(STATE.targetLang);
  });
});

els.mute1.addEventListener('click', () => toggleMute('zh', els.mute1));
els.mute2.addEventListener('click', () => toggleMute('en', els.mute2));

function toggleMute(lang, btn) {
  STATE.muted[lang] = !STATE.muted[lang];
  const audio = lang === 'en' ? els.audio_en : els.audio_zh;
  audio.muted = STATE.muted[lang];
  btn.textContent = STATE.muted[lang] ? '🔇 静音' : '🔊 播放';
  btn.classList.toggle('muted', STATE.muted[lang]);
}

function applyMode(mode) {
  els.modeBox.querySelectorAll('.tg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  els.dirBox.classList.toggle('hidden', mode !== 'single');
  els.panel1Label.textContent = '🇨🇳 中文';
  els.panel2Label.textContent = '🇺🇸 English';
  els.panel1Text.textContent = '等待...';
  els.panel2Text.textContent = 'Waiting...';
}

function applyDirection(target) {
  els.dirBox.querySelectorAll('.tg-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.target === target);
  });
}

function updateMicBtn() {
  els.micBtn.disabled = !els.apiKey.value.trim();
}

function updateControls() {
  els.pauseBtn.disabled = !STATE.isRecording;
  els.stopBtn.disabled = !STATE.isRecording;
  els.pauseBtn.textContent = STATE.isPaused ? '▶' : '⏸';
  els.pauseBtn.title = STATE.isPaused ? '恢复' : '暂停';
  els.modeBox.querySelectorAll('.tg-btn').forEach(b => b.disabled = STATE.isRecording);
  els.dirBox.querySelectorAll('.tg-btn').forEach(b => b.disabled = STATE.isRecording);
}

function setStatus(state, text) {
  els.statusDot.className = 'status-dot ' + state;
  els.statusText.textContent = text;
}

function showError(msg) {
  els.errorBox.textContent = msg;
  els.errorBox.classList.add('show');
  setTimeout(() => els.errorBox.classList.remove('show'), 8000);
}

function logLine(msg) { els.log.textContent = msg; }

els.micBtn.addEventListener('click', async () => {
  if (STATE.isRecording) togglePause();
  else await start();
});

els.pauseBtn.addEventListener('click', togglePause);
els.stopBtn.addEventListener('click', stop);

function togglePause() {
  if (!STATE.isRecording || !STATE.localStream) return;
  STATE.isPaused = !STATE.isPaused;
  STATE.localStream.getAudioTracks().forEach(t => t.enabled = !STATE.isPaused);

  if (STATE.isPaused) {
    els.micBtn.classList.remove('recording');
    els.micBtn.classList.add('paused');
    els.micBtn.textContent = '⏸';
    setStatus('connecting', '已暂停');
    logLine('麦克风静音, 点击恢复');
  } else {
    els.micBtn.classList.remove('paused');
    els.micBtn.classList.add('recording');
    els.micBtn.textContent = '🎤';
    setStatus('connected', '已连接');
    logLine('恢复, 继续说话...');
  }
  updateControls();
}

async function start() {
  const key = els.apiKey.value.trim();
  if (!key) return showError('请先填入 API Key');
  localStorage.setItem('openai_api_key', key);

  try {
    setStatus('connecting', '连接中...');
    logLine('请求麦克风权限...');

    STATE.localStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
      },
    });

    const targets = STATE.mode === 'single' ? [STATE.targetLang] : ['en', 'zh'];
    logLine(`建立 ${targets.length} 个翻译会话...`);

    STATE.sessions = [];
    for (const target of targets) {
      const sess = await createSession(key, target);
      STATE.sessions.push(sess);
    }

    STATE.isRecording = true;
    STATE.isPaused = false;
    els.micBtn.classList.add('recording');
    els.micBtn.textContent = '🎤';
    setStatus('connected', '已连接');
    logLine(STATE.mode === 'single'
      ? (STATE.targetLang === 'en' ? '说中文 → 出英文' : '说英文 → 出中文')
      : '双向模式: 自由说中英文, 自动翻译');
    els.panel1Text.classList.remove('muted-text');
    els.panel2Text.classList.remove('muted-text');
    els.panel1Text.textContent = '';
    els.panel2Text.textContent = '';
    updateControls();
  } catch (err) {
    console.error(err);
    showError(err.message);
    setStatus('error', '错误');
    logLine('连接失败');
    await stop();
  }
}

async function createSession(key, target) {
  const sessionConfig = {
    session: {
      model: MODEL,
      audio: {
        output: {
          language: target,
        },
      },
    },
  };

  const csResp = await fetch(CLIENT_SECRETS_URL, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${key}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(sessionConfig),
  });

  if (!csResp.ok) {
    const errText = await csResp.text();
    throw new Error(`获取凭证失败 (${csResp.status}): ${errText}`);
  }

  const csData = await csResp.json();
  const clientSecret = csData.value || csData.client_secret?.value || csData.client_secret;
  if (!clientSecret) throw new Error('返回数据中找不到 client_secret');

  const pc = new RTCPeerConnection();
  const audioEl = target === 'en' ? els.audio_en : els.audio_zh;

  pc.ontrack = (e) => { audioEl.srcObject = e.streams[0]; };

  STATE.localStream.getTracks().forEach(t => pc.addTrack(t, STATE.localStream));

  const dc = pc.createDataChannel('oai-events');
  const sess = { pc, dc, target, audioEl };
  dc.addEventListener('open', () => onDcOpen(sess));
  dc.addEventListener('message', (e) => onDcMessage(sess, e));
  dc.addEventListener('close', () => setStatus('', '已断开'));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const sdpResp = await fetch(CALLS_URL, {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${clientSecret}`,
      'Content-Type': 'application/sdp',
    },
    body: offer.sdp,
  });

  if (!sdpResp.ok) {
    const errText = await sdpResp.text();
    throw new Error(`SDP 交换失败 (${sdpResp.status}): ${errText}`);
  }

  const answerSdp = await sdpResp.text();
  await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
  return sess;
}

function onDcOpen(sess) {
  const sessionUpdate = {
    type: 'session.update',
    session: {
      audio: {
        output: { language: sess.target },
      },
    },
  };
  try { sess.dc.send(JSON.stringify(sessionUpdate)); } catch {}
}

const CJK_RE = /[一-鿿]/;
function detectLang(text) { return CJK_RE.test(text) ? 'zh' : 'en'; }

// Per-session text accumulators
const accum = new WeakMap();
function getAcc(sess) {
  let a = accum.get(sess);
  if (!a) { a = { source: '', target: '' }; accum.set(sess, a); }
  return a;
}

function onDcMessage(sess, e) {
  let evt;
  try { evt = JSON.parse(e.data); } catch { return; }
  const a = getAcc(sess);

  switch (evt.type) {
    case 'session.input_transcript.delta':
    case 'conversation.item.input_audio_transcription.delta':
      a.source += (evt.delta || '');
      routeText(sess, 'source', a.source);
      break;
    case 'session.input_transcript.completed':
    case 'conversation.item.input_audio_transcription.completed':
      if (evt.transcript) a.source = evt.transcript;
      routeText(sess, 'source', a.source, true);
      a.source = '';
      break;
    case 'session.output_transcript.delta':
    case 'response.audio_transcript.delta':
      a.target += (evt.delta || '');
      routeText(sess, 'target', a.target);
      break;
    case 'session.output_transcript.completed':
    case 'response.audio_transcript.done':
      if (evt.transcript) a.target = evt.transcript;
      routeText(sess, 'target', a.target, true);
      a.target = '';
      break;
    case 'input_audio_buffer.speech_started':
      logLine('🎙️ 检测到语音...');
      break;
    case 'input_audio_buffer.speech_stopped':
      logLine('翻译中...');
      break;
    case 'session.created':
    case 'session.updated':
      break;
    case 'error':
      showError(`API 错误: ${evt.error?.message || JSON.stringify(evt.error)}`);
      break;
  }
}

function routeText(sess, kind, text, isFinal) {
  if (!text) return;

  // Always route by language: panel1 = 中文, panel2 = English
  // For source: detect lang from content
  // For target: session.target IS the output language
  let lang;
  if (kind === 'source') {
    lang = detectLang(text);
    // In dual mode dedupe: both sessions emit same input transcript. Only accept from session whose target ≠ source lang.
    if (STATE.mode === 'dual' && sess.target === lang) return;
  } else {
    lang = sess.target;
  }

  const panel = lang === 'zh' ? els.panel1Text : els.panel2Text;
  panel.textContent = text;
  if (isFinal && kind === 'target') logLine('继续说话...');
}

async function stop() {
  STATE.isRecording = false;
  STATE.isPaused = false;
  els.micBtn.classList.remove('recording', 'paused');
  els.micBtn.textContent = '🎤';

  for (const s of STATE.sessions) {
    try { s.dc.close(); } catch {}
    try { s.pc.close(); } catch {}
  }
  STATE.sessions = [];

  if (STATE.localStream) {
    STATE.localStream.getTracks().forEach(t => t.stop());
    STATE.localStream = null;
  }
  els.audio_en.srcObject = null;
  els.audio_zh.srcObject = null;
  setStatus('', '未连接');
  logLine('已停止');
  updateControls();
}

window.addEventListener('beforeunload', stop);
</script>
</body>
</html>
